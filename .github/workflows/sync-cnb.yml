name: "🔄 同步代码至 CNB"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb-main
  cancel-in-progress: false

jobs:
  sync:
    name: "🔄 GitHub → CNB"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 检出完整 Git 历史"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🚀 推送 main 分支至 CNB"
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "::error::未找到 CNB_TOKEN，请在 GitHub 仓库的 Actions Secrets 中配置。"
            exit 1
          fi

          askpass_file="$(mktemp)"
          trap 'rm -f "$askpass_file"' EXIT
          cat > "$askpass_file" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "$CNB_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass_file"
          export GIT_ASKPASS="$askpass_file"
          export GIT_TERMINAL_PROMPT=0

          git remote add cnb https://cnb.cool/adui-studio/agent-engineering-kit
          git push cnb HEAD:refs/heads/main
