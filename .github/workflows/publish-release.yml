name: "🚀 发布正式版本"

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - "docs/releases/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-main
  cancel-in-progress: false

jobs:
  validate:
    name: "✅ 验证发布内容"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 检出发布版本"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "🧪 验证文档与单元测试"
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest discover -s tests -v

      - name: "🔍 核对版本与发布说明"
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^V[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION 格式不正确，预期如 V1.0"
            exit 1
          fi
          notes="docs/releases/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::缺少发布说明：$notes"
            exit 1
          fi
          if ! grep -q "$version" "$notes"; then
            echo "::error::发布说明必须包含当前版本：$version"
            exit 1
          fi

  publish:
    name: "🚀 创建 GitHub Release"
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: "📥 检出发布文件"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "🏷️ 创建标签与正式 Release"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^V([0-9]+)\.([0-9]+)$ ]] || exit 1
          tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          notes="docs/releases/${version}.md"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "版本 $tag 已发布，不覆盖现有 Tag 或 Release。"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag 已存在但 Release 不存在，请人工检查。"
            exit 1
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes-file "$notes" \
            --latest

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,isDraft,isPrerelease
