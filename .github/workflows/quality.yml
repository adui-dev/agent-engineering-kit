name: "🧪 仓库文档与 Skills 校验"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "✅ 版本、文档与 Skills"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📥 检出代码"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "🔍 校验仓库结构与文档"
        run: python3 scripts/validate_repository.py

      - name: "🧪 运行校验脚本单元测试"
        run: python3 -m unittest discover -s tests -v

      - name: "🐍 验证已有示例项目"
        run: python3 -m unittest discover -s examples/existing-python/tests -v

      - name: "🚦 运行初始化 Smoke Test"
        run: bash scripts/smoke_init.sh
