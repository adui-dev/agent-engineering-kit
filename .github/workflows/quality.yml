name: "🧪 仓库文档与 Skills 校验"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "✅ 质量检查 (${{ matrix.os }}, Python ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: "📥 检出代码"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "🐍 设置 Python 版本"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: "🔍 校验仓库结构与文档"
        run: python scripts/validate_repository.py

      - name: "🧪 运行校验脚本单元测试"
        run: python -m unittest discover -s tests -v

      - name: "🐍 验证已有示例项目"
        run: python -m unittest discover -s examples/existing-python/tests -v

      - name: "🧪 跨平台真实 CLI 安装测试"
        run: python scripts/smoke_init.py

      - name: "🚦 运行 Bash Smoke Test"
        if: runner.os == 'Linux'
        run: bash scripts/smoke_init.sh
