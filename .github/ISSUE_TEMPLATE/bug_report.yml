name: "🐛 缺陷反馈"
description: "报告 Prompt、Skills、文档或自动化工具的问题"
title: "🐛 "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请勿提交密钥、隐私数据或可利用的安全漏洞细节；安全问题请阅读 SECURITY.md。"
  - type: input
    id: version
    attributes:
      label: "版本 / Git Commit"
      placeholder: "V1.1 或 Commit SHA"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "问题描述与预期结果"
      description: "描述问题、预期和实际行为"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "复现步骤"
      description: "如涉及脚本请提供无敏感信息的命令和最小复现"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "操作系统、Python、Agent 工具与版本（适用时）"
