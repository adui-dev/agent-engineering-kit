name: "✨ 功能建议"
description: "建议新功能、兼容适配或工程化改进"
title: "✨ "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题"
      description: "请描述真实使用场景，以及当前的不足"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案"
      description: "说明目标、范围、建议实现与验收条件"
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: "兼容性与风险"
      description: "涉及的 Agent 工具、已有工作流及潜在风险（如适用）"
